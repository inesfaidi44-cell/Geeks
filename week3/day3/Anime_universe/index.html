
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANIMEVERSE | Anime Characters Vault</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <h1>⚡ ANIMEVERSE</h1>
            <p>Discover your favorite anime characters</p>
        </div>

        <div class="search-container">
            <input
                type="search"
                id="search-input"
                placeholder="Search characters..."
            >
        </div>
    </header>


    <!-- CONTROLS -->
    <section class="controls">

        <div class="filter-group">

            <label for="category-filter">Category:</label>

            <select id="category-filter">
                <option value="All">All Categories</option>
                <option value="Hero">Heroes</option>
                <option value="Villain">Villains</option>
                <option value="Anti-Hero">Anti-Heroes</option>
            </select>

        </div>


        <div class="filter-group">

            <label for="anime-filter">Anime:</label>

            <select id="anime-filter">
                <option value="All">All Anime</option>
                <option value="Jujutsu Kaisen">Jujutsu Kaisen</option>
                <option value="One Piece">One Piece</option>
                <option value="Naruto">Naruto</option>
                <option value="Attack on Titan">Attack on Titan</option>
                <option value="Hunter x Hunter">Hunter x Hunter</option>
                <option value="Demon Slayer">Demon Slayer</option>
                <option value="Death Note">Death Note</option>
            </select>

        </div>


        <div class="filter-group">

            <label for="sort-select">Sort by:</label>

            <select id="sort-select">
                <option value="default">Default</option>
                <option value="az">Name (A-Z)</option>
                <option value="za">Name (Z-A)</option>
                <option value="power">Power (Highest)</option>
            </select>

        </div>

    </section>


    <!-- MAIN SHOWCASE -->
    <main>

        <h2>Explore Characters</h2>

        <div id="cards-grid">
            
        </div>

        <div id="empty-state" class="hidden">
            <p>No characters found matching your criteria.</p>
        </div>

    </main>


    <!-- CHARACTER DETAILS MODAL -->
    <dialog id="character-modal">

        <button id="close-modal" type="button" aria-label="Close">
            ✕
        </button>

        <div id="modal-content">
            
        </div>

    </dialog>


    <script src="data.js"></script>
    <script src="app.js"></script>

</body>

</html>
